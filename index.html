<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SECOND CHANCE TYCOON</title><style>*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172536;color:#fff;font:15px ui-monospace,monospace}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}button{font:inherit;color:#fff;background:#344762;border:2px solid #142031;border-bottom-width:4px;border-radius:7px;padding:8px;min-height:38px}button:active{transform:translateY(2px)}#top{position:fixed;top:7px;left:7px;display:flex;gap:5px;flex-wrap:wrap;max-width:65vw}.pill{background:#111d2cdd;border:2px solid #0b1420;border-radius:6px;padding:5px 8px}#cash{color:#ffdd52;font-size:18px}#buttons{position:fixed;right:7px;top:7px;display:flex;gap:4px}#hint{position:fixed;top:52px;left:50%;transform:translateX(-50%);background:#142031c9;padding:5px 10px;border-radius:5px;text-align:center;max-width:62vw;font-size:13px}#joy{position:fixed;left:22px;bottom:20px;width:124px;height:124px;border-radius:50%;border:3px solid #ffffff55;background:#ffffff22}#knob{position:absolute;left:32px;top:32px;width:60px;height:60px;border:3px solid #ffffffaa;border-radius:50%;background:#ffffff77}#act{position:fixed;right:20px;bottom:25px;width:92px;height:92px;border-radius:50%;background:#e5a318;border-color:#7b4e00;font-weight:bold}#modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center}#panel{background:#1c2a40;border:3px solid #0b1420;border-radius:10px;width:min(600px,92vw);max-height:90vh;overflow:auto;padding:10px;touch-action:pan-y}#panel *{touch-action:pan-y}.head{display:flex;align-items:center;justify-content:space-between;font-size:20px;color:#ffdc58;font-weight:bold;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}.item{background:#2a3b55;text-align:left}.item small{display:block;opacity:.75;font-size:11px;margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #ffffff20}.hide{display:none!important}#toast{position:fixed;top:95px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:8px 12px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none}#toast.on{opacity:1}#portrait{display:none}@media(orientation:portrait){#portrait{display:flex;position:fixed;inset:0;z-index:9;background:#172536;align-items:center;justify-content:center;text-align:center;font-size:22px}}@media(max-height:430px){#joy{width:100px;height:100px;bottom:12px}#knob{left:24px;top:24px}#act{width:78px;height:78px;bottom:14px}button{min-height:32px;padding:5px;font-size:13px}}</style></head><body><canvas id="c"></canvas><div id="top"><div class="pill" id="cash">💰 50 €</div><div class="pill" id="day">☀ Tag 1</div><div class="pill" id="bag">🎒 0/8</div><div class="pill" id="rank">🏅 Anfänger</div></div><div id="buttons"><button onclick="build()">🏗️ Ausbau</button><button onclick="save()">💾</button></div><div id="hint">Nutze den Joystick: Markt ist rechts, Garage links.</div><div id="joy"><div id="knob"></div></div><button id="act" onclick="act()">AKTION</button><div id="modal" class="hide"><div id="panel"></div></div><div id="toast"></div><div id="portrait">📱↻<br>Bitte quer halten</div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),ui={cash:document.querySelector('#cash'),day:document.querySelector('#day'),bag:document.querySelector('#bag'),rank:document.querySelector('#rank'),hint:document.querySelector('#hint'),act:document.querySelector('#act'),modal:document.querySelector('#modal'),panel:document.querySelector('#panel'),toast:document.querySelector('#toast')};let W,H,scale=1,cam={x:0,y:0},joy={x:0,y:0},p={x:7,y:8},time=0,stock=[],repair=0,sellT=0,toastT;const items=[['toaster','🍞','Toaster',6,18],['lamp','💡','Lampe',5,15],['chair','🪑','Stuhl',5,16],['radio','📻','Radio',10,32],['bike','🚲','Fahrrad',18,60],['phone','📱','Handy',15,55],['console','🎮','Spielkonsole',40,135],['washer','🧺','Waschmaschine',55,170],['guitar','🎸','E-Gitarre',85,270],['drone','🚁','Drohne',110,360],['piano','🎹','Klavier',190,620],['moped','🛵','Moped',260,820],['server','🗄️','Server-Rack',400,1250],['motor','🏍️','Motorrad',520,1700],['car','🚗','Auto-Wrack',1200,4000]];const get=id=>items.find(i=>i[0]===id),init=()=>({money:50,day:1,earned:0,rep:0,level:0,cap:8,inv:[],fixed:[],stock:[],px:7,py:8,spd:0,ads:0});let S;try{S=JSON.parse(localStorage.getItem('sct3save'))||init()}catch(e){S=init()}p={x:S.px||7,y:S.py||8};
const stalls=[{x:24,y:7,n:'Ramsch',ids:['toaster','lamp','chair','radio','bike','phone']},{x:27,y:7,n:'Haushalt',ids:['console','washer','guitar','piano']},{x:30,y:7,n:'Fahrzeuge',ids:['moped','motor','car']},{x:33,y:7,n:'Hightech',ids:['drone','server','phone','radio']}];if(!S.stock||S.stock.length!==4)restock();function restock(){S.stock=stalls.map(s=>s.ids.map(id=>({id,n:get(id)[3]>150?1:2+Math.floor(Math.random()*3),price:Math.max(1,Math.round(get(id)[3]*(.8+Math.random()*.5)))})))}
function resize(){scale=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*scale;c.height=H*scale;x.setTransform(scale,0,0,scale,0,0);x.imageSmoothingEnabled=false}onresize=resize;resize();function iso(a,b){return[(a-b)*18+W/2,(a+b)*9+H/2+10]}function poly(pts,col){x.fillStyle=col;x.beginPath();pts.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.closePath();x.fill()}function tile(a,b,col){const[sx,sy]=iso(a,b);poly([[sx,sy-9],[sx+18,sy],[sx,sy+9],[sx-18,sy]],col)}function block(a,b,col,h=20){const[sx,sy]=iso(a,b),w=13;poly([[sx-w,sy-9],[sx,sy],[sx,sy-h],[sx-w,sy-h-9]],shade(col,.72));poly([[sx,sy],[sx+w,sy-9],[sx+w,sy-h-9],[sx,sy-h]],shade(col,.58));poly([[sx-w,sy-h-9],[sx,sy-h],[sx+w,sy-h-9],[sx,sy-h-18]],shade(col,1.16))}function shade(c,m){let n=parseInt(c.slice(1),16);return`rgb(${Math.min(255,(n>>16)*m|0)},${Math.min(255,((n>>8)&255)*m|0)},${Math.min(255,(n&255)*m|0)})`}
function tree(a,b){const[sx,sy]=iso(a,b);x.fillStyle='#694322';x.fillRect(sx-2,sy-2,4,12);for(const[o,r,col]of [[-4,9,'#2d873c'],[3,8,'#319448'],[0,6,'#4eaf4f']]){x.fillStyle=col;x.beginPath();x.arc(sx+o,sy-9,r,0,7);x.fill()}}
function drawMap(){x.fillStyle='#203044';x.fillRect(0,0,W,H);for(let a=Math.floor(p.x-18);a<p.x+18;a++)for(let b=Math.floor(p.y-18);b<p.y+18;b++){let col='#6cb84b';if(a>=3&&a<15&&b>=3&&b<13)col=(a+b)%2?'#c4ae87':'#d0bb94';if(a>=21&&a<36&&b>=3&&b<14)col=(a+b)%2?'#d5c08d':'#c8b17b';if(b===17||b===18)col='#4b4e5a';if(b===16||b===19)col='#b9b7ad';if(a>38&&b>20&&b<27)col='#399ce2';tile(a,b,col);if(col==='#6cb84b'&&(a*31+b*17)%27===0)tree(a,b)}
 // homes and industrial skyline
 [[-5,22,'#c96c4d'],[-11,24,'#5b92c4'],[-18,20,'#b98842'],[42,1,'#9155aa'],[48,3,'#bf5c53']].forEach(([a,b,col])=>{block(a,b,col,28);const[sx,sy]=iso(a,b);block(a,b-1,'#5c3b2e',4);x.fillStyle='#bfe6fa';x.fillRect(sx+3,sy-20,5,6);x.fillStyle='#523b2a';x.fillRect(sx-9,sy-16,5,12)});
 // market stalls
 stalls.forEach((s,i)=>{block(s.x,s.y,'#89572e',15);block(s.x,s.y-1,['#e85d75','#3b82d9','#f59e0b','#06a6a6'][i],4);const[sx,sy]=iso(s.x,s.y);x.fillStyle='#fff';x.font='10px monospace';x.textAlign='center';x.fillText(s.n,sx,sy-31);s.ids.slice(0,3).forEach((id,j)=>{x.fillStyle=['#ef7c65','#52bb83','#f5ce51'][j];x.fillRect(sx-10+j*8,sy-9,6,5)})});
 // machines garage
 block(5,6,'#b57938',9);block(9,6,'#278e5a',9);let [bx,by]=iso(5,6);x.fillStyle='#ddd';x.fillRect(bx-8,by-16,16,3);let [cx,cy]=iso(9,6);x.fillStyle='#ffe077';x.fillRect(cx-9,cy-17,18,3);
 // fountain, street lamps and pond ripple
 const[fX,fY]=iso(18,8);x.fillStyle='#9aa8b3';x.beginPath();x.ellipse(fX,fY,17,8,0,0,7);x.fill();x.fillStyle='#49b9f1';x.beginPath();x.ellipse(fX,fY-3,12,5,0,0,7);x.fill();x.fillStyle='#d6f3ff';x.fillRect(fX-1,fY-14-Math.sin(time*3)*2,2,10);
 for(let i=0;i<3;i++){let [lx,ly]=iso(20+i*5,14);x.fillStyle='#333';x.fillRect(lx-1,ly-22,2,22);x.fillStyle='#ffe68a';x.fillRect(lx-4,ly-25,8,4)}
 // player sprite
 drawPlayer();}
function drawPlayer(){const[sx,sy]=iso(p.x,p.y),bob=Math.sin(time*12)*2,step=Math.sin(time*13)*2;x.fillStyle='#0005';x.beginPath();x.ellipse(sx,sy,8,4,0,0,7);x.fill();x.fillStyle='#29354a';x.fillRect(sx-5+step,sy-8,4,8);x.fillRect(sx+1-step,sy-8,4,8);x.fillStyle='#f1c27d';x.fillRect(sx-5+step,sy-1,5,2);x.fillRect(sx+1-step,sy-1,5,2);x.fillStyle='#e76f2e';x.fillRect(sx-6,sy-18+bob,12,11);x.fillStyle='#f3bb79';x.fillRect(sx-4,sy-28+bob,8,9);x.fillStyle='#4a2c20';x.fillRect(sx-4,sy-30+bob,8,3);x.fillRect(sx-4,sy-27+bob,2,3);x.fillStyle='#151515';x.fillRect(sx-2,sy-24+bob,1,2);x.fillRect(sx+2,sy-24+bob,1,2);x.fillStyle='#7b4926';x.fillRect(sx-8,sy-17+bob,3,8);x.fillStyle='#d1a75e';x.fillRect(sx-8,sy-17+bob,3,2);}
function near(){let best=null,d=2.8;stalls.forEach((s,i)=>{let q=Math.hypot(s.x+.5-p.x,s.y+.5-p.y);if(q<d){d=q;best={t:'market',i,n:'🛒 '+s.n}}});for(const[o,n]of [[[5,6],'🔧 Werkbank'],[[9,6],'🛍️ Tresen']]){let q=Math.hypot(o[0]+.5-p.x,o[1]+.5-p.y);if(q<d){d=q;best={t:'machine',o,n}}}return best}
function open(title,html){ui.panel.innerHTML=`<div class="head"><span>${title}</span><button onclick="close()">✕</button></div>${html}`;ui.modal.classList.remove('hide')}function close(){ui.modal.classList.add('hide')}
function market(i){const rows=S.stock[i].map((q,j)=>{let v=get(q.id);return`<button class="item" onclick="buy(${i},${j})">${v[1]} ${v[2]} <b>${q.price}€</b><small>Bestand ${q.n} · repariert ca. ${v[4]}€</small></button>`}).join('');open('🏪 '+stalls[i].n,`<p>Günstiger Schrott und seltene, teure Fundstücke. Dein Startkapital beträgt nur 50 €.</p><div class="grid">${rows}</div>`)}
function buy(i,j){let q=S.stock[i][j];if(!q||!q.n)return toast('Ausverkauft');if(S.money<q.price)return toast('Dafür musst du erst sparen!');if(S.inv.length>=S.cap)return toast('Rucksack voll');S.money-=q.price;q.n--;S.inv.push(q.id);hud()}
function machine(which){if(which==='bench'){let n=S.inv.filter(id=>get(id));if(!n.length)return toast('Kaufe erst ein defektes Gerät am Markt');let id=n[0];S.inv.splice(S.inv.indexOf(id),1);repair=2.5;S.repairing=id;toast('Werkbank repariert '+get(id)[2]+' …');return}if(which==='counter'){if(!S.fixed.length)return toast('Lege erst reparierte Ware auf den Tresen');S.stockforSale=(S.stockforSale||0)+1;S.fixed.shift();toast('Ware ins Verkaufsregal gelegt! Kunden kaufen automatisch.');return}}
function act(){let n=near();if(!n){toast('Geh näher an den Markt, die Werkbank oder den Tresen.');return}if(n.t==='market')market(n.i);else machine(n.o[0]===5?'bench':'counter')}
function build(){let levels=[['Werkstatt',250],['Werkhalle',1200],['Fabrikkomplex',5000],['Industriepark',18000]];let opts=levels.map((z,i)=>`<div class="row"><span>🏭 ${z[0]} <small>(größere Karte & mehr Platz)</small></span><button onclick="upgrade(${i},${z[1]})">${z[1]}€</button></div>`).join('');opts+=`<div class="row"><span>👟 Laufschuhe +15% (Stufe ${S.spd||0})</span><button onclick="upgradeGear('spd',${[120,500,1500,4000][S.spd||0]||0})">${[120,500,1500,4000][S.spd||0]||'Max'}€</button></div><div class="row"><span>📣 Werbung: mehr Kunden (Stufe ${S.ads||0})</span><button onclick="upgradeGear('ads',${[200,800,2500,8000][S.ads||0]||0})">${[200,800,2500,8000][S.ads||0]||'Max'}€</button></div>`;open('🏗️ Ausbau & teure Anschaffungen',opts)}function upgrade(i,cost){if(S.level!==i){toast('Nächster Ausbau zuerst');return}if(S.money<cost)return toast('Noch nicht genug Geld');S.money-=cost;S.level++;close();toast('🏗️ Garage erweitert!')}function upgradeGear(k,c){if(!c||S.money<c)return toast('Dafür musst du sparen');S.money-=c;S[k]=(S[k]||0)+1;close();toast('Upgrade gekauft!')}
function toast(s){ui.toast.textContent=s;ui.toast.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>ui.toast.classList.remove('on'),2200)}function save(){S.px=p.x;S.py=p.y;try{localStorage.setItem('sct3save',JSON.stringify(S))}catch(e){}toast('Spielstand gespeichert')}function hud(){ui.cash.textContent='💰 '+Math.floor(S.money)+' €';ui.day.textContent='☀ Tag '+S.day;ui.bag.textContent='🎒 '+S.inv.length+'/'+S.cap;ui.rank.textContent='🏅 '+(S.earned>2000?'Werkstattchef':S.earned>500?'Flohmarkt-Profi':'Anfänger');let n=near();ui.act.textContent=n?n.n:'AKTION';ui.hint.textContent=n?'In Reichweite: '+n.n+' · tippe AKTION':'Joystick bewegen · rechts liegt der Schrottmarkt'}
let keys={};onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key==='e'||e.key===' ')act()};onkeyup=e=>keys[e.key.toLowerCase()]=0;const joyEl=document.querySelector('#joy'),knob=document.querySelector('#knob');joyEl.onpointerdown=e=>{joyEl.setPointerCapture(e.pointerId);movejoy(e)};joyEl.onpointermove=e=>{if(e.buttons)movejoy(e)};joyEl.onpointerup=joyEl.onpointercancel=()=>{joy.x=joy.y=0;knob.style.transform=''};function movejoy(e){let r=joyEl.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=r.width/2-10,d=Math.hypot(dx,dy);if(d>m){dx*=m/d;dy*=m/d}joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}
function update(dt){time+=dt;let a=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),b=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),m=Math.hypot(a,b);if(m>1){a/=m;b/=m}let sp=2.8*(1+.15*(S.spd||0));p.x=Math.max(1,Math.min(52,p.x+a*sp*dt));p.y=Math.max(1,Math.min(32,p.y+b*sp*dt));if(repair>0&&((repair-=dt)<=0)){S.fixed.push('fx_'+S.repairing);repair=0;toast('✅ Repariert! Bring es zum Tresen.')}sellT+=dt;if(sellT>5/(1+.35*(S.ads||0))){sellT=0;if(S.stockforSale>0){S.stockforSale--;let id=S.fixed.shift()||S.lastfixed||'fx_lamp',v=id.startsWith('fx_')?get(id.slice(3)):null;let val=v?v[4]:18;S.money+=val;S.earned+=val;S.rep++;toast('Kunde kauft für '+val+'€!')}}if(time>100){time=0;S.day++;restock()}hud()}
function render(){let [cx,cy]=iso(p.x,p.y);cam.x+=(cx-cam.x)*.08;cam.y+=(cy-cam.y)*.08; // translate camera by drawing offset through ctx
 x.save();x.translate(W/2-cam.x,H/2-cam.y+10);drawMap();x.restore()}
let last=performance.now();function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop)}hud();requestAnimationFrame(loop);onpagehide=save;
</script></body></html>
